[project]
name = "deckoy"
version = "1.0.0"
description = "A decoy Network Dock that keeps the Elgato Stream Deck app connected"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["PySide6>=6.12.0", "Pillow>=12.3.0", "zeroconf>=0.151.5"]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt", "pyinstaller"]

[tool.setuptools.packages.find]
include = ["deckoy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
